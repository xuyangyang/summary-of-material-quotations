services:
  - type: web
    name: material-analysis-backend
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Absolute path on the mounted disk. Four slashes = absolute /var/data/app.db
      - key: DATABASE_URL
        value: sqlite:////var/data/app.db
      - key: CORS_ORIGINS
        value: "*"
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      # sync: false -> set the real key in the Render dashboard, never in the repo
      - key: DEEPSEEK_API_KEY
        sync: false
    disk:
      name: material-data
      mountPath: /var/data
      sizeGB: 1